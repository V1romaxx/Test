# ============================================================
#  bosses.yml  -  Bosse = bestehende Mobs + neue Attacken
#  Spawnen: /boss spawn <id>      Neu laden: /boss reload
#
#  Boss-Attacken (Typ):
#    slam        radius, damage, knockback, up, delay-ticks (Warnring, dann Einschlag)
#    summon      entity, count, radius, max-alive, name
#    leap        strength, height, land-radius, land-damage, land-delay-ticks
#    projectile  projectile (small_fireball|fireball|wither_skull|arrow|snowball),
#                count, spread, speed, yield, break-blocks
#    lightning   strikes, damage, radius, delay-ticks
#    pull        radius, strength, damage
#    heal        percent
#    potion      effect, seconds, amplifier, radius
#    command     commands: [..]  Platzhalter %boss% %target%
#    message     text, radius
#
#  Für jede Attacke:
#    cooldown (Sekunden), range (0 = egal), min-health-percent, max-health-percent
#  Phasen: at (% Leben), message, sound, speed-multiplier, damage-multiplier
#  Drops:  weapon: <waffen-id>  ODER  item: MATERIAL + amount, chance 0.0-1.0
#  equipment: head/chest/legs/feet/mainhand/offhand = MATERIAL oder weapon:<id>
# ============================================================
bosses:
  zombie_king:
    type: ZOMBIE
    name: "<dark_red><bold>Zombie-König</bold>"
    health: 300
    damage: 10
    speed: 0.28
    knockback-resistance: 0.6
    fire-immune: true
    bar-color: RED
    bar-overlay: NOTCHED_10
    bar-range: 40
    target-range: 24
    attack-delay: 3
    exp: 500
    clear-drops: true
    death-message: "<gold>Der Zombie-König ist gefallen!"
    equipment:
      head: NETHERITE_HELMET
      chest: NETHERITE_CHESTPLATE
      mainhand: "weapon:flame_blade"
    attacks:
      - type: slam
        cooldown: 8
        range: 6
        radius: 6
        damage: 8
        delay-ticks: 20
      - type: summon
        cooldown: 25
        entity: ZOMBIE
        count: 3
        max-alive: 6
      - type: leap
        cooldown: 12
        range: 20
        strength: 1.4
        height: 0.8
        land-radius: 4
        land-damage: 6
      - type: lightning
        cooldown: 15
        max-health-percent: 50
        strikes: 3
        damage: 8
      - type: heal
        cooldown: 40
        max-health-percent: 25
        percent: 10
    phases:
      - at: 50
        message: "<red>Der Zombie-König wird wütend!"
        sound: entity.zombie_villager.converted
        speed-multiplier: 1.25
        damage-multiplier: 1.3
    drops:
      - weapon: flame_blade
        chance: 0.5
      - item: DIAMOND
        amount: 5
        chance: 1.0

  ember_skeleton:
    type: WITHER_SKELETON
    name: "<gold><bold>Glutskelett</bold>"
    health: 200
    damage: 8
    speed: 0.3
    fire-immune: true
    bar-color: YELLOW
    bar-overlay: NOTCHED_6
    attack-delay: 2
    exp: 300
    equipment:
      mainhand: STONE_SWORD
    attacks:
      - type: projectile
        cooldown: 4
        range: 25
        projectile: small_fireball
        count: 3
        spread: 0.15
        speed: 1.3
      - type: pull
        cooldown: 18
        radius: 12
        strength: 1.1
        damage: 4
      - type: potion
        cooldown: 20
        radius: 8
        effect: slowness
        seconds: 4
        amplifier: 1
    phases:
      - at: 40
        message: "<gold>Das Glutskelett beginnt zu glühen!"
        speed-multiplier: 1.3
    drops:
      - weapon: vampire_dagger
        chance: 0.4
