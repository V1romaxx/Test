name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Plugin bauen
        run: mvn -B -f "$(find . -name pom.xml | head -1)" package
      - name: Jar hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CustomCore-jar
          path: "**/target/CustomCore-1.0.0.jar"
