name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Plugin bauen
        run: mvn -B package
      - name: Jar hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CustomCore-jar
          path: target/CustomCore-1.0.0.jar
